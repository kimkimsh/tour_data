name: ingest

# 04:00 KST. Once a day is the right cadence for what this collects: the crowding
# figure is a 30-day forecast and the visitor figure lags by days, so an hourly run
# would multiply the call count and add nothing to the screens.
#
# The changed snapshot files are committed, which is what replaces the ingest-history
# table the earlier design had: `git diff` answers "what changed since yesterday".

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm ingest
        env:
          # The DECODING form of the key. The ENCODING form is re-encoded by
          # URLSearchParams and the gateway answers resultCode 30.
          KTO_SERVICE_KEY_DECODING: ${{ secrets.KTO_SERVICE_KEY_DECODING }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      - name: Commit the snapshot diff
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore(ingest): daily snapshot"
          git push
