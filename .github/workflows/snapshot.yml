name: snapshot

# 04:30 KST, half an hour after the Vercel cron that collects.
#
# Collection moved to a Vercel Function in icn1: a GitHub runner could not reliably
# open a connection to apis.data.go.kr — UND_ERR_CONNECT_TIMEOUT, all-or-nothing per
# run, so the wall was bound to the runner's address. A function cannot commit to git,
# which is the half that stayed here. The committed files are what makes `git diff`
# answer "what changed since yesterday", and they are the fixtures the e2e suite runs
# against.
#
# This job talks to Supabase and to nothing else, so that wall does not apply to it.
# It is also why a failure here is not a data problem: the snapshots are already
# published and on the screens by the time this runs.

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm pull:snapshots
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit the snapshot diff
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/generated
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore(ingest): daily snapshot"
          git push
